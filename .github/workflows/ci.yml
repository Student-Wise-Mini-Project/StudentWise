name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studentwise
          POSTGRES_PASSWORD: studentwise
          POSTGRES_DB: studentwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studentwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI runs Postgres on the default port; local dev uses 5434 because 5432
      # is often taken by a native Postgres install on Windows.
      DATABASE_URL: postgresql+psycopg://studentwise:studentwise@localhost:5432/studentwise
      TEST_DATABASE_URL: postgresql+psycopg://studentwise:studentwise@localhost:5432/studentwise_test
      JWT_SECRET: ci-secret-not-used-anywhere-real-but-long-enough

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create the test database
        run: PGPASSWORD=studentwise psql -h localhost -U studentwise -d studentwise -c 'CREATE DATABASE studentwise_test;'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check migrations match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Test
        run: pytest
