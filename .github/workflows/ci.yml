name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studentwise
          POSTGRES_PASSWORD: studentwise
          POSTGRES_DB: studentwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studentwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI runs Postgres on the default port; local dev uses 5434 because 5432
      # is often taken by a native Postgres install on Windows.
      DATABASE_URL: postgresql+psycopg://studentwise:studentwise@localhost:5432/studentwise
      TEST_DATABASE_URL: postgresql+psycopg://studentwise:studentwise@localhost:5432/studentwise_test
      JWT_SECRET: ci-secret-not-used-anywhere-real-but-long-enough

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create the test database
        run: PGPASSWORD=studentwise psql -h localhost -U studentwise -d studentwise -c 'CREATE DATABASE studentwise_test;'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check migrations match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The frontend's `alembic check`: the API types are generated from the backend,
  # so a response model that changes without a regenerated client is a build
  # failure rather than a runtime 422 somebody finds in the demo.
  #
  # This needs both toolchains but no database -- importing `app.main` produces
  # the whole schema without ever opening a connection.
  contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate the API types from the backend
        env:
          JWT_SECRET: ci-secret-not-used-anywhere-real-but-long-enough
        run: |
          python -c "import json, sys; sys.path.insert(0, 'backend'); from app.main import app; print(json.dumps(app.openapi(), indent=2))" > frontend/openapi.json
          cd frontend
          OPENAPI_SOURCE=openapi.json node scripts/gen-api.mjs

      - name: Fail if the committed client is out of date
        run: |
          if ! git diff --exit-code -- frontend/src/api/schema.d.ts; then
            echo "::error::The API types are stale. Run 'npm run gen:api' in frontend/ and commit the result."
            exit 1
          fi

  # The image Render deploys (docs/deployment.md), built and booted the way
  # Render runs it. A broken Dockerfile, a migration that fails on an empty
  # database or a production setting that refuses to start then fails the PR
  # -- and Render's autoDeployTrigger: checksPass never ships it.
  image:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studentwise
          POSTGRES_PASSWORD: studentwise
          POSTGRES_DB: studentwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studentwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t studentwise .

      - name: Boot it in production mode
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgresql://studentwise:studentwise@localhost:5432/studentwise \
            -e JWT_SECRET="$(openssl rand -base64 48)" \
            -e PORT=8000 \
            studentwise
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 1; done

      - name: It migrated, serves the API and the app, with the production headers
        run: |
          curl -sf localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/auth/me)" = 401
          curl -sf localhost:8000/groups | grep -q '<div id="root">'
          curl -sfI localhost:8000/ | grep -qi '^content-security-policy:'
          curl -sfI localhost:8000/ | grep -qi '^strict-transport-security:'

      - name: Server log
        if: always()
        run: docker logs app
