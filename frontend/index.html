<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets env(safe-area-inset-*) return anything
         other than zero on a notched iPhone. Without it the tab bar sits under
         the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>StudentWise</title>
    <meta
      name="description"
      content="Split expenses with the people you live, travel and eat with."
    />

    <!-- Kept in step with src/styles/theme.css by hand: the browser chrome is
         painted before any stylesheet has loaded, so it cannot read a token. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#edefef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1214" />

    <!-- iOS home-screen install. Safari ignores most of the web app manifest,
         so these have to be here as well as in the manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StudentWise" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Heebo and Assistant both ship full Hebrew alongside Latin, which is why
         they were chosen: the app is English now and RTL Hebrew later. Heebo
         carries every number, so it needs 800/900 as well. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <script>
      // Runs before the first paint. Without this the page renders in the OS
      // theme for a frame and then snaps to the chosen one -- a white flash on
      // every cold start for anyone who picked dark.
      try {
        var t = localStorage.getItem('sw.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
